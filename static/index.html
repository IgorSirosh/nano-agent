<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NanoAgent v2.0 — Автономный AI-ассистент</title>
  <link rel="stylesheet" href="/static/styles.css?v=2.0">
  <script src="/static/marked.min.js"></script>
</head>
<body>
  <aside id="sidebar" aria-label="История диалогов">
    <div class="sidebar-header">
      <button type="button" class="btn-new-chat" id="btn-new-chat">
        <span>+</span> Новый диалог
      </button>
      <div class="session-search-wrap">
        <input type="search" id="session-search" class="session-search-input" placeholder="Поиск по диалогам..." aria-label="Поиск по диалогам">
      </div>
    </div>
    <div class="sessions-list" id="sessions-list"></div>
  </aside>

  <div id="main-wrapper">
    <header>
      <div class="header-left">
        <button type="button" class="toggle-sidebar-btn" id="btn-toggle-sidebar" title="Скрыть или показать список диалогов" aria-label="Переключить боковую панель">☰</button>
        <div class="header-title-box">
          <h1>
            <span>🧠 NanoAgent</span>
            <span class="header-badge" id="header-version-badge">v2.0</span>
          </h1>
          <button type="button" class="cwd-pill" id="cwd-pill-btn" title="Нажмите, чтобы изменить рабочую директорию сессии">
            <span>📁</span>
            <span id="cwd-text">~</span>
          </button>
        </div>
      </div>

      <div class="header-right">
        <button type="button" class="model-header-btn" id="model-header-btn" title="Выбрать модель нейросети">
          <span class="m-icon" id="m-header-icon">⚡</span>
          <span class="m-text-box">
            <span class="m-sublabel">Модель</span>
            <span class="m-name" id="m-header-name">Flash 1M</span>
          </span>
          <span class="m-badge" id="m-header-badge">1M</span>
          <span class="m-arrow">▾</span>
        </button>

        <button type="button" class="btn-distill-now" id="btn-distill-now" title="Сжать старую историю диалога в Active Memory">
          <span>⚡</span>
          <span>Сжать память</span>
        </button>

        <div class="pill-balance" id="pill-balance" title="Доступный баланс API">—</div>

        <div class="context-meter-box" id="context-meter-box" title="Заполненность активного окна контекста">
          <span class="meter-label">Контекст:</span>
          <div class="meter-bar-outer">
            <div class="meter-bar-inner" id="meter-bar-inner"></div>
          </div>
          <span id="meter-text">0%</span>
        </div>

        <button type="button" class="btn-header-settings" id="btn-header-settings" title="Настройки API, провайдера и системного промпта">
          <span>⚙️</span>
          <span class="hide-sm">Настройки</span>
        </button>
      </div>
    </header>

    <div class="active-memory-strip hidden" id="active-memory-strip">
      <div class="memory-strip-head">
        <span>🧠 Active Memory загружена в системный контекст</span>
        <button type="button" class="btn-link-sm" id="btn-toggle-memory-preview">Показать / скрыть</button>
      </div>
      <div class="memory-strip-body hidden" id="memory-strip-body"></div>
    </div>

    <main id="chat-container" aria-live="polite"></main>

    <footer>
      <div class="input-box-wrapper">
        <div class="model-pills-bar" id="model-pills-bar">
          <span class="model-pills-label">⚡ Модель:</span>
          <div class="model-pills-list" id="model-pills-list"></div>
          <button type="button" class="model-pill-more" id="btn-open-model-modal" title="Открыть полный каталог моделей">
            ⚙️ Каталог
          </button>
        </div>

        <textarea id="chat-input" rows="2" placeholder="Опишите задачу... (Enter — отправить, Shift+Enter — новая строка)"></textarea>

        <div class="input-toolbar">
          <div class="toolbar-left">
            <div class="mode-switcher" role="group" aria-label="Режим работы агента">
              <button type="button" class="mode-btn active" id="mode-btn-plan" data-mode="plan" title="Сначала исследует проект и предлагает план; изменения только после подтверждения">
                🧭 План
              </button>
              <button type="button" class="mode-btn" id="mode-btn-act" data-mode="act" title="Автономное выполнение команд и правка файлов без подтверждения">
                ⚡ Авто
              </button>
            </div>

            <label class="toolbar-field">
              <span>Reasoning:</span>
              <select class="toolbar-select" id="reasoning-select">
                <option value="low" selected>Low</option>
                <option value="none">None</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
              </select>
            </label>

            <label class="toolbar-field">
              <span>Лимит:</span>
              <select class="toolbar-select" id="context-limit-select">
                <option value="16000">16k</option>
                <option value="32000" selected>32k</option>
                <option value="64000">64k</option>
                <option value="128000">128k</option>
              </select>
            </label>

            <label class="toolbar-field">
              <span>Сжатие:</span>
              <select class="toolbar-select" id="threshold-select">
                <option value="0.40">40%</option>
                <option value="0.50" selected>50%</option>
                <option value="0.60">60%</option>
                <option value="0.70">70%</option>
              </select>
            </label>

            <select class="hidden" id="model-select" aria-hidden="true"></select>
          </div>

          <div class="toolbar-actions">
            <button type="button" class="btn-stop hidden" id="btn-stop">⏹ Стоп</button>
            <button type="button" class="btn-send" id="btn-send">Отправить</button>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <dialog id="model-modal" closedby="any" aria-labelledby="model-modal-title">
    <div class="dialog-header">
      <div class="modal-title">
        <h1 id="model-modal-title">🧠 Выбор модели нейросети</h1>
        <span class="modal-provider-badge" id="modal-provider-badge">Abliteration AI</span>
      </div>
      <form method="dialog">
        <button type="submit" class="modal-close-btn" aria-label="Закрыть">✕</button>
      </form>
    </div>
    <div class="dialog-body">
      <div class="model-cards-grid" id="model-cards-grid"></div>
      <div class="custom-model-box">
        <label for="custom-model-input">Свой ID модели:</label>
        <div class="custom-model-input-row">
          <input type="text" id="custom-model-input" placeholder="например: anthropic/claude-3.7-sonnet или deepseek/deepseek-chat" autofocus>
          <button type="button" id="custom-model-apply-btn">Применить</button>
        </div>
      </div>
    </div>
  </dialog>

  <dialog id="settings-modal" closedby="any" aria-labelledby="settings-modal-title">
    <div class="dialog-header">
      <div class="modal-title">
        <h1 id="settings-modal-title">⚙️ Настройки NanoAgent</h1>
      </div>
      <form method="dialog">
        <button type="submit" class="modal-close-btn" aria-label="Закрыть">✕</button>
      </form>
    </div>
    <div class="settings-tabs">
      <button type="button" class="settings-tab active" data-tab="api">🔑 API и провайдер</button>
      <button type="button" class="settings-tab" data-tab="prompt">📝 Системный промпт</button>
    </div>
    <div class="dialog-body">
      <div id="tab-panel-api" class="settings-form">
        <div class="settings-field">
          <label for="settings-provider-select">Провайдер нейросетей:</label>
          <select id="settings-provider-select" class="settings-input">
            <option value="abliteration">Abliteration AI (Без цензуры, по умолчанию)</option>
            <option value="openrouter">OpenRouter API (Claude, GPT, DeepSeek)</option>
            <option value="custom">Свой OpenAI-совместимый сервер</option>
          </select>
        </div>

        <div class="settings-field hidden" id="settings-baseurl-group">
          <label for="settings-baseurl-input">Base URL API:</label>
          <input type="url" id="settings-baseurl-input" class="settings-input" placeholder="https://api.example.com/v1">
        </div>

        <div class="settings-field">
          <label for="settings-apikey-input">Основной API-ключ (<span id="settings-key-label">Abliteration ak_...</span>):</label>
          <input type="password" id="settings-apikey-input" class="settings-input" placeholder="Оставьте пустым, чтобы сохранить текущий ключ">
        </div>

        <div class="settings-field" id="settings-admin-group">
          <label for="settings-adminkey-input">Admin Key (для баланса Abliteration, опционально):</label>
          <div class="inline-field-row">
            <input type="password" id="settings-adminkey-input" class="settings-input" placeholder="sk_... (необязательно)">
            <button type="button" class="btn-cancel hidden" id="btn-clear-adminkey" title="Удалить сохранённый Admin Key">Очистить</button>
          </div>
        </div>

        <div id="settings-save-status" class="status-banner hidden"></div>

        <div class="dialog-actions">
          <form method="dialog">
            <button type="submit" class="btn-cancel">Отмена</button>
          </form>
          <button type="button" class="btn-save-settings" id="settings-save-btn">💾 Сохранить API</button>
        </div>
      </div>

      <div id="tab-panel-prompt" class="settings-form hidden">
        <div class="settings-field">
          <label for="system-prompt-editor">Базовые инструкции агента (system_prompt.txt):</label>
          <textarea id="system-prompt-editor" class="settings-input prompt-textarea" rows="11"></textarea>
        </div>
        <div id="prompt-save-status" class="status-banner hidden"></div>
        <div class="dialog-actions space-between">
          <button type="button" class="btn-cancel" id="prompt-reset-btn">↺ Сбросить к стандартному</button>
          <button type="button" class="btn-save-settings" id="prompt-save-btn">💾 Сохранить промпт</button>
        </div>
      </div>
    </div>
  </dialog>

  <dialog id="cwd-modal" closedby="any" aria-labelledby="cwd-modal-title">
    <div class="dialog-header">
      <div class="modal-title">
        <h1 id="cwd-modal-title">📁 Рабочая директория и название</h1>
      </div>
      <form method="dialog">
        <button type="submit" class="modal-close-btn" aria-label="Закрыть">✕</button>
      </form>
    </div>
    <div class="dialog-body">
      <div class="settings-form">
        <div class="settings-field">
          <label for="cwd-modal-input">Рабочий каталог (cwd) для этой сессии:</label>
          <input type="text" id="cwd-modal-input" class="settings-input" placeholder="/home/user/project" autofocus>
        </div>
        <div class="settings-field">
          <label for="title-modal-input">Название диалога:</label>
          <input type="text" id="title-modal-input" class="settings-input" placeholder="Название сессии">
        </div>
        <div id="cwd-save-status" class="status-banner hidden"></div>
        <div class="dialog-actions">
          <form method="dialog">
            <button type="submit" class="btn-cancel">Отмена</button>
          </form>
          <button type="button" class="btn-save-settings" id="cwd-save-btn">💾 Применить</button>
        </div>
      </div>
    </div>
  </dialog>

  <script src="/static/app.js?v=2.0"></script>
</body>
</html>
